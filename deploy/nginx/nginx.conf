# HengBerGer 云端入口
#   - 8443 端口 TLS 终结（大陆无域名 => 80/443 不可用，只能走高位端口 + 自签证书）
#   - /img/* 由 nginx 直接读盘，不经过 Node
#   - /api/* 默认拒绝，只放行公开的 /api/catalog/*
#
# 挂载：/etc/nginx/nginx.conf（只读）、/etc/nginx/certs（证书）、/srv/images（图片，只读）
# 设计依据：docs/plans/2026-10-14-cloud-android-design.md §1 §2.6 §3

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile           on;
  tcp_nopush         on;
  keepalive_timeout  65;
  server_tokens      off;

  # 首次导入整包会走这个入口，别让 nginx 先把请求掐掉
  client_max_body_size 1024m;
  client_body_timeout  300s;

  log_format main '$remote_addr - $status $body_bytes_sent "$request_method $uri" $request_time';
  access_log /var/log/nginx/access.log main;

  upstream hengbeger_app {
    server app:3001;
    keepalive 16;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 自签阶段不开 HSTS：一旦钉死，将来换证书前浏览器都进不去
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ---------------- 图片：内容寻址（文件名即 sha256），可以永久缓存 ----------------
    location ^~ /img/ {
      alias /srv/images/;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---------------- 健康检查：不记日志 ----------------
    location = /health/live  { proxy_pass http://hengbeger_app; access_log off; }
    location = /health/ready { proxy_pass http://hengbeger_app; access_log off; }
    location = /health       { proxy_pass http://hengbeger_app; access_log off; }

    # ---------------- 公开接口：网页与 App 只用到 /api/catalog/* ----------------
    location ^~ /api/catalog/ {
      proxy_pass http://hengbeger_app;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_read_timeout 120s;
    }

    # ---------------- 其余 /api/* 一律拒绝：云端没有管理员，也没有写接口 ----------------
    location ^~ /api/   { return 403; }
    location = /metrics { return 403; }

    # ---------------- 网页本体（Vite 产物由 Node 托管，前端路由回落到 index.html）----------------
    location / {
      proxy_pass http://hengbeger_app;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_read_timeout 120s;
    }
  }
}
